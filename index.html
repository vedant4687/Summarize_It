<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summarize It</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 700px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
            text-align: center;
        }
        textarea {
            width: 100%;
            height: 180px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: vertical;
            font-size: 15px;
            margin-bottom: 15px;
            outline: none;
        }
        textarea:focus {
            border-color: #4a90e2;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #357abd;
        }
        .output-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #f9f9f9;
            border-left: 4px solid #4a90e2;
            border-radius: 4px;
            min-height: 80px;
            font-size: 15px;
            color: #444;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Dialogue & Text Summarizer</h1>
        <textarea id="userInput" placeholder="Write or paste your content below..."></textarea>
        <button onclick="getSummary()">Summarize</button>

        <div class="output-box" id="output">Content Summary will appear here...</div>
    </div>

    <script>
        async function getSummary() {
            const input = document.getElementById("userInput").value;
            const output = document.getElementById("output");

            if (!input.trim()) {
                alert("Please enter text before submitting.");
                return;
            }

            output.innerText = "Summarizing...";

            try {
                const response = await fetch("/summarize", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ dialogue: input })
                });

                if (response.ok) {
                    const data = await response.json();
                    output.innerText = data.summary;
                } else {
                    output.innerText = "Error: Failed to process text.";
                }
            } catch (err) {
                console.error("Network error:", err);
                output.innerText = "Error: Could not connect to the backend server.";
            }
        }
    </script>
</body>
</html>
